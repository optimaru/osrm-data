# CI runs this file with `pre-commit run --all-files`, so passing locally means passing there.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        # Country codes in countries.yml, such as usal for Alabama.
        args: ["--ignore-words-list=usal,usin"]
        files: ^.*\.(py|md|yml)$

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --group precommit ty check src
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
