# Countries built every night.
#
#   code       lowercase key used for storage paths and by readers
#   name       display name
#   extract    path of the extract under `source`, without `-latest.osm.pbf`
#   algorithm  optional, overrides `algorithm` below
#
# A country too large for a hosted runner is built as regions, each with its own
# code. A route cannot cross from one region to another, see "Capacity" in the README.
source: https://download.geofabrik.de
# ch answers distance matrices about five times faster than mld, and a matrix is
# what the route optimizer asks for. mld preprocesses about ten times faster.
algorithm: ch
countries:
  - code: kr
    name: South Korea
    extract: asia/south-korea
  - code: my
    name: Malaysia, Singapore and Brunei
    extract: asia/malaysia-singapore-brunei
  - code: tw
    name: Taiwan
    extract: asia/taiwan
  - code: ph
    name: Philippines
    extract: asia/philippines
  - code: th
    name: Thailand
    extract: asia/thailand
  - code: vn
    name: Vietnam
    extract: asia/vietnam
  - code: au
    name: Australia
    extract: australia-oceania/australia
  - code: id
    name: Indonesia
    extract: asia/indonesia
  - code: jp
    name: Japan
    extract: asia/japan
  # Middle East and Central Asia.
  - code: gcc
    name: Gulf Cooperation Council
    extract: asia/gcc-states
  - code: tr
    name: Turkey
    extract: europe/turkey
  - code: eg
    name: Egypt
    extract: africa/egypt
  - code: uz
    name: Uzbekistan
    extract: asia/uzbekistan
  - code: kz
    name: Kazakhstan
    extract: asia/kazakhstan
  # Asia and Oceania.
  - code: mn
    name: Mongolia
    extract: asia/mongolia
  - code: kh
    name: Cambodia
    extract: asia/cambodia
  - code: la
    name: Laos
    extract: asia/laos
  - code: bd
    name: Bangladesh
    extract: asia/bangladesh
  - code: nz
    name: New Zealand
    extract: australia-oceania/new-zealand
  # India, too large as a whole.
  - code: insouth
    name: India, southern zone
    extract: asia/india/southern-zone
  - code: inwest
    name: India, western zone
    extract: asia/india/western-zone
  - code: innorth
    name: India, northern zone
    extract: asia/india/northern-zone
  - code: ineast
    name: India, eastern zone
    extract: asia/india/eastern-zone
  - code: incentral
    name: India, central zone
    extract: asia/india/central-zone
  # Europe.
  - code: gb
    name: Great Britain
    extract: europe/great-britain
  - code: fr
    name: France
    extract: europe/france
  - code: es
    name: Spain
    extract: europe/spain
  - code: nl
    name: Netherlands
    extract: europe/netherlands
  - code: pl
    name: Poland
    extract: europe/poland
  - code: hu
    name: Hungary
    extract: europe/hungary
  - code: cz
    name: Czech Republic
    extract: europe/czech-republic
  - code: sk
    name: Slovakia
    extract: europe/slovakia
  - code: ro
    name: Romania
    extract: europe/romania
  # Germany by state. Geofabrik publishes no checksum for the whole country.
  - code: dehe
    name: Germany, Hesse
    extract: europe/germany/hessen
  - code: denw
    name: Germany, North Rhine-Westphalia
    extract: europe/germany/nordrhein-westfalen
  - code: deby
    name: Germany, Bavaria
    extract: europe/germany/bayern
  - code: debw
    name: Germany, Baden-Wuerttemberg
    extract: europe/germany/baden-wuerttemberg
  # Latin America.
  - code: mx
    name: Mexico
    extract: north-america/mexico
  - code: cl
    name: Chile
    extract: south-america/chile
  - code: brsudeste
    name: Brazil, Southeast
    extract: south-america/brazil/sudeste
  - code: brsul
    name: Brazil, South
    extract: south-america/brazil/sul
  # Canada by province.
  - code: caon
    name: Ontario
    extract: north-america/canada/ontario
  - code: cabc
    name: British Columbia
    extract: north-america/canada/british-columbia
  - code: caqc
    name: Quebec
    extract: north-america/canada/quebec
  - code: caab
    name: Alberta
    extract: north-america/canada/alberta
  # United States. The Northeast stays whole because New York spans three states. The Midwest and South run out of
  # memory, and the West fits but exceeds osrm-server's default memory budget, so those are built by state.
  - code: usnortheast
    name: United States, Northeast
    extract: north-america/us-northeast
  - code: usca
    name: California
