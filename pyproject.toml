[project]
name = "osrm-data"
version = "0.1.0"
description = "Nightly per-country OSRM road network datasets built from OpenStreetMap extracts."
requires-python = "~=3.14.0"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.35,<2",
    # The dataset format is tied to this version. Readers must use the same one,
    # so it is pinned exactly and recorded in every manifest.
    "osrm-bindings==26.10.0",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osrm_data"]

[dependency-groups]
test = [
    "moto[s3]>=5,<6",
    "pytest>=8",
]
precommit = [
    "pre-commit~=4.0",
    "ty>=0.0.59,<0.1",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = ["e2e: runs the real OSRM toolchain on a small extract (needs network)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
