name: nightly build

# Rebuilds every country whose extract changed and publishes it to S3.
#
# Required repository configuration:
#   environment `prod`, variable AWS_ROLE_ARN    role assumed through OIDC
#   repository variable OSRM_DATA_BUCKET         destination bucket
#
# This workflow must never run on pull_request: the repository is public and the
# build job can assume an AWS role.

on:
  schedule:
    # 03:00 in Korea. The extracts are refreshed late in the UTC evening.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: Space-separated country codes (default all)
        required: false
        default: ""
      force:
        description: Rebuild even if the extract is unchanged
        type: boolean
        default: false
      upload:
        description: Publish to S3
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.matrix.outputs.countries }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - id: matrix
        env:
          ONLY: ${{ inputs.countries }}
        run: echo "countries=$(uv run --no-dev python -m osrm_data matrix --only "$ONLY")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build (${{ matrix.country }})
    runs-on: ubuntu-latest
    # The role trusts this environment on main only. A run that does not upload
    # needs no credentials, so it stays outside the environment.
    environment: ${{ (github.event_name == 'schedule' || inputs.upload) && 'prod' || '' }}
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        country: ${{ fromJSON(needs.plan.outputs.countries) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The temporary disk has far more room than the root disk. Swap lets a
      # country slightly over the memory limit finish slowly instead of being killed.
      - name: Prepare disk and swap
        run: |
          sudo mkdir -p /mnt/osrm
          sudo chown "$USER" /mnt/osrm
          sudo fallocate -l 16G /mnt/osrm-swap
          sudo chmod 600 /mnt/osrm-swap
          sudo mkswap /mnt/osrm-swap
          sudo swapon /mnt/osrm-swap
          df -h / /mnt
          free -h

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.UPLOAD == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Build and publish
        env:
          COUNTRY: ${{ matrix.country }}
          BUCKET: ${{ vars.OSRM_DATA_BUCKET }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(build "$COUNTRY" --workdir /mnt/osrm)
          if [ "$UPLOAD" = "true" ]; then args+=(--bucket "$BUCKET"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          uv run --no-dev python -m osrm_data "${args[@]}"

  # GitHub disables scheduled workflows after 60 days without repository activity,
  # and a healthy nightly build produces no commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable nightly.yml
